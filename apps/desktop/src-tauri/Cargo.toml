[package]
name = "radiadash"
version = "0.1.0"
description = "RadiaCode 110 dashboard and spectrometer"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[lib]
name = "radiadash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
radiadash-core = { path = "../../../crates/radiadash-core" }
radiadash-sim = { path = "../../../crates/radiadash-sim" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
